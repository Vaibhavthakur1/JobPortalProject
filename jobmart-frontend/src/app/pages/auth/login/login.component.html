<div class="min-h-screen flex items-center justify-center px-4 transition-colors duration-300"
     [ngClass]="uiStore.isDarkMode()
       ? 'bg-gradient-to-br from-gray-950 via-gray-900 to-indigo-950'
       : 'bg-gradient-to-br from-indigo-50 via-white to-blue-50'">

  <!-- Dark mode toggle -->
  <button (click)="uiStore.toggleDarkMode()"
    class="fixed top-5 right-5 w-10 h-10 rounded-xl flex items-center justify-center transition-all shadow-md"
    [ngClass]="uiStore.isDarkMode() ? 'bg-gray-800 text-yellow-400 hover:bg-gray-700' : 'bg-white text-gray-600 hover:bg-gray-100'">
    <svg *ngIf="uiStore.isDarkMode()" class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
      <path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V3a.75.75 0 01.75-.75zM7.5 12a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM18.894 6.166a.75.75 0 00-1.06-1.06l-1.591 1.59a.75.75 0 101.06 1.061l1.591-1.59zM21.75 12a.75.75 0 01-.75.75h-2.25a.75.75 0 010-1.5H21a.75.75 0 01.75.75zM17.834 18.894a.75.75 0 001.06-1.06l-1.59-1.591a.75.75 0 10-1.061 1.06l1.59 1.591zM12 18a.75.75 0 01.75.75V21a.75.75 0 01-1.5 0v-2.25A.75.75 0 0112 18zM7.758 17.303a.75.75 0 00-1.061-1.06l-1.591 1.59a.75.75 0 001.06 1.061l1.591-1.59zM6 12a.75.75 0 01-.75.75H3a.75.75 0 010-1.5h2.25A.75.75 0 016 12zM6.697 7.757a.75.75 0 001.06-1.06l-1.59-1.591a.75.75 0 00-1.061 1.06l1.59 1.591z"/>
    </svg>
    <svg *ngIf="!uiStore.isDarkMode()" class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
      <path fill-rule="evenodd" d="M9.528 1.718a.75.75 0 01.162.819A8.97 8.97 0 009 6a9 9 0 009 9 8.97 8.97 0 003.463-.69.75.75 0 01.981.98 10.503 10.503 0 01-9.694 6.46c-5.799 0-10.5-4.701-10.5-10.5 0-4.368 2.667-8.112 6.46-9.694a.75.75 0 01.818.162z" clip-rule="evenodd"/>
    </svg>
  </button>

  <div class="w-full max-w-md animate-fade-in">
    <!-- Card -->
    <div class="rounded-3xl shadow-2xl p-8 border transition-colors duration-300"
         [ngClass]="uiStore.isDarkMode() ? 'bg-gray-900 border-gray-700/50' : 'bg-white border-gray-100'">

      <!-- Logo -->
      <div class="text-center mb-8">
        <div class="w-14 h-14 bg-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-indigo-500/30">
          <svg class="w-7 h-7 text-white" fill="currentColor" viewBox="0 0 24 24">
            <path d="M20 6h-2.18c.07-.44.18-.88.18-1.36C18 2.06 15.94 0 13.36 0c-1.46 0-2.75.67-3.6 1.72L9 3 8.24 1.72C7.39.67 6.1 0 4.64 0 2.06 0 0 2.06 0 4.64c0 .48.11.92.18 1.36H0v2h20V6z"/>
          </svg>
        </div>
        <h1 class="text-2xl font-black" [ngClass]="uiStore.isDarkMode() ? 'text-white' : 'text-gray-900'">
          Welcome back
        </h1>
        <p class="text-sm mt-1" [ngClass]="uiStore.isDarkMode() ? 'text-gray-400' : 'text-gray-500'">
          Sign in to your JobMart account
        </p>
      </div>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" autocomplete="off" class="space-y-4">

        <!-- Email -->
        <div>
          <label class="block text-sm font-semibold mb-2"
                 [ngClass]="uiStore.isDarkMode() ? 'text-gray-300' : 'text-gray-700'">Email</label>
          <input type="email" formControlName="email" placeholder="you@example.com"
            autocomplete="off"
            class="w-full px-4 py-3 rounded-xl border text-sm transition-all focus:outline-none focus:ring-2"
            [ngClass]="[
              (form.get('email')?.invalid && form.get('email')?.touched)
                ? 'border-red-400 focus:ring-red-400'
                : 'focus:ring-indigo-500',
              uiStore.isDarkMode()
                ? 'bg-gray-800 border-gray-700 text-white placeholder-gray-500'
                : 'bg-gray-50 border-gray-200 text-gray-900 placeholder-gray-400'
            ]" />
          <div *ngIf="form.get('email')?.invalid && form.get('email')?.touched" class="mt-1.5 text-xs text-red-500 font-medium">
            <span *ngIf="form.get('email')?.errors?.['required']">Email is required.</span>
            <span *ngIf="form.get('email')?.errors?.['email']">Enter a valid email address.</span>
          </div>
        </div>

        <!-- Password -->
        <div>
          <label class="block text-sm font-semibold mb-2"
                 [ngClass]="uiStore.isDarkMode() ? 'text-gray-300' : 'text-gray-700'">Password</label>
          <div class="relative">
            <input [type]="showPassword ? 'text' : 'password'" formControlName="password" placeholder="••••••••"
              autocomplete="off"
              class="w-full px-4 py-3 pr-11 rounded-xl border text-sm transition-all focus:outline-none focus:ring-2"
              [ngClass]="[
                (form.get('password')?.invalid && form.get('password')?.touched)
                  ? 'border-red-400 focus:ring-red-400'
                  : 'focus:ring-indigo-500',
                uiStore.isDarkMode()
                  ? 'bg-gray-800 border-gray-700 text-white placeholder-gray-500'
                  : 'bg-gray-50 border-gray-200 text-gray-900 placeholder-gray-400'
              ]" />
            <button type="button" (click)="showPassword = !showPassword"
              class="absolute right-3 top-1/2 -translate-y-1/2 p-1 rounded-lg transition-colors"
              [ngClass]="uiStore.isDarkMode() ? 'text-gray-400 hover:text-gray-200' : 'text-gray-400 hover:text-gray-700'">
              <svg *ngIf="!showPassword" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
              </svg>
              <svg *ngIf="showPassword" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
              </svg>
            </button>
          </div>
          <div *ngIf="form.get('password')?.invalid && form.get('password')?.touched" class="mt-1.5 text-xs text-red-500 font-medium">
            <span *ngIf="form.get('password')?.errors?.['required']">Password is required.</span>
            <span *ngIf="form.get('password')?.errors?.['minlength']">Password must be at least 6 characters.</span>
          </div>
        </div>

        <div class="flex justify-end">
          <a routerLink="/forgot-password" class="text-xs font-semibold text-indigo-500 hover:text-indigo-400 transition-colors">
            Forgot password?
          </a>
        </div>

        <!-- Server error -->
        <div *ngIf="authStore.error()"
          class="bg-red-500/10 border border-red-500/20 text-red-500 px-4 py-3 rounded-xl text-sm font-semibold">
          {{ authStore.error() }}
        </div>

        <button type="submit" [disabled]="form.invalid || authStore.isLoading()"
          class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold hover:bg-indigo-700 transition-all disabled:opacity-50 shadow-lg shadow-indigo-500/25 flex items-center justify-center gap-2">
          <div *ngIf="authStore.isLoading()" class="animate-spin rounded-full h-4 w-4 border-2 border-white border-t-transparent"></div>
          {{ authStore.isLoading() ? 'Signing in...' : 'Sign In' }}
        </button>
      </form>

      <div class="mt-6 pt-6 border-t text-center"
           [ngClass]="uiStore.isDarkMode() ? 'border-gray-700' : 'border-gray-100'">
        <p class="text-sm" [ngClass]="uiStore.isDarkMode() ? 'text-gray-400' : 'text-gray-500'">
          Don't have an account?
          <a routerLink="/register" class="font-bold text-indigo-500 hover:text-indigo-400 ml-1 transition-colors">
            Create one
          </a>
        </p>
      </div>
    </div>
  </div>
</div>
