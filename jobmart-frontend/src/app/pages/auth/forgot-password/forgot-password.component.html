<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-50 to-blue-50 px-4">
  <div class="w-full max-w-md">
    <div class="bg-white rounded-2xl shadow-xl p-8">
      <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-indigo-600 mb-2">JobMart</h1>
        <p class="text-gray-600">{{ step === 1 ? 'Reset your password' : 'Enter OTP & new password' }}</p>
      </div>

      <!-- Step 1: Enter Email -->
      <form *ngIf="step === 1" [formGroup]="emailForm" (ngSubmit)="sendOtp()" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Email Address</label>
          <input type="email" formControlName="email" placeholder="you@example.com" class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>
        <div *ngIf="error" class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg text-sm">{{ error }}</div>
        <button type="submit" [disabled]="emailForm.invalid || loading" class="w-full bg-indigo-600 text-white py-3 rounded-lg font-semibold hover:bg-indigo-700 disabled:opacity-50">
          {{ loading ? 'Sending...' : 'Send OTP' }}
        </button>
        <div class="text-center"><a routerLink="/login" class="text-sm text-indigo-600 hover:underline">Back to Login</a></div>
      </form>

      <!-- Step 2: Enter OTP + New Password -->
      <form *ngIf="step === 2" [formGroup]="resetForm" (ngSubmit)="resetPassword()" class="space-y-4">
        <p class="text-sm text-gray-600 bg-indigo-50 p-3 rounded-lg">OTP sent to <strong>{{ emailForm.get('email')?.value }}</strong></p>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">OTP Code</label>
          <input type="text" formControlName="otp" placeholder="000000" maxlength="6" class="w-full border border-gray-300 rounded-lg px-4 py-3 text-center text-2xl tracking-widest focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">New Password</label>
          <input type="password" formControlName="newPassword" placeholder="Min 6 characters" class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>
        <div *ngIf="error" class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg text-sm">{{ error }}</div>
        <button type="submit" [disabled]="resetForm.invalid || loading" class="w-full bg-indigo-600 text-white py-3 rounded-lg font-semibold hover:bg-indigo-700 disabled:opacity-50">
          {{ loading ? 'Resetting...' : 'Reset Password' }}
        </button>
        <button type="button" (click)="sendOtp()" class="w-full bg-gray-100 text-gray-700 py-2 rounded-lg text-sm hover:bg-gray-200">Resend OTP</button>
      </form>
    </div>
  </div>
</div>
