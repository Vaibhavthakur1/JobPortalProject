<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-50 to-blue-50 px-4">
  <div class="w-full max-w-md">
    <div class="bg-white rounded-2xl shadow-xl p-8">
      <h1 class="text-2xl font-bold text-center mb-2">Verify Email</h1>
      <p class="text-center text-gray-600 mb-6">
        Enter the 6-digit OTP sent to {{ email }}
      </p>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            OTP Code
          </label>
          <input
            type="text"
            formControlName="otp"
            placeholder="000000"
            maxlength="6"
            class="w-full text-center text-2xl tracking-widest"
          />
        </div>

        <button
          type="submit"
          [disabled]="form.invalid || authStore.isLoading()"
          class="w-full bg-indigo-600 text-white py-3 rounded-lg font-semibold hover:bg-indigo-700 transition-colors disabled:opacity-50"
        >
          Verify OTP
        </button>

        <button
          type="button"
          (click)="resendOtp()"
          [disabled]="authStore.isLoading()"
          class="w-full bg-gray-100 text-gray-700 py-3 rounded-lg font-semibold hover:bg-gray-200 transition-colors"
        >
          Resend OTP
        </button>
      </form>
    </div>
  </div>
</div>
