<div class="min-h-screen bg-slate-50 pt-28 pb-12 px-4">
  <div class="max-w-6xl mx-auto">
    <div class="flex items-center justify-between mb-8">
      <div>
        <h1 class="text-3xl font-black text-gray-900 font-headline">My Job Listings</h1>
        <p class="text-gray-500 mt-1">Manage all your posted jobs</p>
      </div>
      <a routerLink="/recruiter/post-job" class="bg-indigo-600 text-white px-5 py-2.5 rounded-xl font-bold text-sm hover:bg-indigo-700 transition-colors flex items-center gap-2">
        <span class="material-symbols-outlined text-base">add</span>Post New Job
      </a>
    </div>

    <div *ngIf="loading()" class="space-y-3">
      <div *ngFor="let i of [1,2,3,4]" class="animate-pulse bg-white rounded-2xl h-24"></div>
    </div>

    <div *ngIf="!loading() && jobs().length === 0" class="text-center py-20 bg-white rounded-3xl border border-gray-100">
      <span class="material-symbols-outlined text-5xl text-gray-300 mb-3 block">work_off</span>
      <p class="text-xl font-bold text-gray-500">No jobs posted yet</p>
      <a routerLink="/recruiter/post-job" class="mt-4 inline-block bg-indigo-600 text-white px-6 py-3 rounded-xl font-bold hover:bg-indigo-700">Post Your First Job</a>
    </div>

    <div class="space-y-3">
      <div *ngFor="let job of jobs()" class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 hover:border-indigo-200 transition-all">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-4">
            <div class="w-12 h-12 bg-indigo-100 rounded-xl flex items-center justify-center">
              <span class="material-symbols-outlined text-indigo-600">work</span>
            </div>
            <div>
              <p class="font-black text-gray-900">{{ job.title }}</p>
              <p class="text-sm text-gray-400 mt-0.5">{{ job.location }} · {{ job.jobType }} · {{ job.industry }}</p>
              <p class="text-xs text-gray-300 mt-0.5">Posted {{ job.createdAt + 'Z' | date:'mediumDate' }}</p>
            </div>
          </div>
          <div class="flex items-center gap-2 flex-wrap justify-end">
            <span class="px-3 py-1 rounded-full text-xs font-bold" [ngClass]="job.status === 'Active' ? 'bg-green-100 text-green-700' : job.status === 'Closed' ? 'bg-red-100 text-red-700' : 'bg-gray-100 text-gray-500'">{{ job.status }}</span>
            <a [routerLink]="['/recruiter/pipeline', job.id]" class="px-3 py-1.5 bg-indigo-50 text-indigo-700 rounded-xl text-xs font-bold hover:bg-indigo-100 transition-colors">View Pipeline</a>
            <button *ngIf="job.status === 'Active'" (click)="closeJob(job.id)" class="px-3 py-1.5 bg-yellow-50 text-yellow-700 rounded-xl text-xs font-bold hover:bg-yellow-100 transition-colors">Close</button>
            <button *ngIf="job.status !== 'Archived'" (click)="archiveJob(job.id)" class="px-3 py-1.5 bg-gray-100 text-gray-600 rounded-xl text-xs font-bold hover:bg-gray-200 transition-colors">Archive</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
