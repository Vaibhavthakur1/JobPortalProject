<div class="min-h-screen bg-slate-50 pt-28 pb-12 px-4">
  <div class="max-w-3xl mx-auto">
    <a routerLink="/recruiter/listings" class="inline-flex items-center gap-2 text-sm font-semibold text-gray-500 hover:text-indigo-600 mb-6 transition-colors">
      <span class="material-symbols-outlined text-base">arrow_back</span>Back to Listings
    </a>
    <div class="bg-white rounded-3xl p-8 shadow-sm border border-gray-100">
      <h1 class="text-2xl font-black text-gray-900 font-headline mb-6">Post a New Job</h1>

      <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-5">
        <div class="grid grid-cols-2 gap-4">
          <div class="col-span-2">
            <label class="block text-sm font-semibold text-gray-700 mb-2">Job Title *</label>
            <input formControlName="title" type="text" placeholder="e.g. Senior .NET Developer" class="w-full border border-gray-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-gray-50" />
          </div>
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Company *</label>
            <input formControlName="company" type="text" class="w-full border border-gray-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-gray-50" />
          </div>
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Location *</label>
            <input formControlName="location" type="text" placeholder="e.g. Mumbai, Remote" class="w-full border border-gray-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-gray-50" />
          </div>
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Job Type *</label>
            <select formControlName="jobType" class="w-full border border-gray-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-gray-50">
              <option value="Full-time">Full-time</option>
              <option value="Part-time">Part-time</option>
              <option value="Contract">Contract</option>
              <option value="Remote">Remote</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Industry *</label>
            <select formControlName="industry" class="w-full border border-gray-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-gray-50">
              <option value="Technology">Technology</option>
              <option value="Finance">Finance</option>
              <option value="Healthcare">Healthcare</option>
              <option value="Education">Education</option>
              <option value="Marketing">Marketing</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Min Salary (₹)</label>
            <input formControlName="salaryMin" type="number" placeholder="e.g. 500000" class="w-full border border-gray-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-gray-50" />
          </div>
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Max Salary (₹)</label>
            <input formControlName="salaryMax" type="number" placeholder="e.g. 1200000" class="w-full border border-gray-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-gray-50" />
          </div>
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Experience Required (years) *</label>
            <input formControlName="experienceYears" type="number" min="0" class="w-full border border-gray-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-gray-50" />
          </div>
          <div class="col-span-2">
            <label class="block text-sm font-semibold text-gray-700 mb-2">Required Skills</label>
            <div class="flex gap-2 mb-2">
              <input #skillInput type="text" placeholder="Add skill..." class="flex-1 border border-gray-200 rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-gray-50 text-sm" (keydown.enter)="addSkill(skillInput.value); skillInput.value = ''; $event.preventDefault()" />
              <button type="button" (click)="addSkill(skillInput.value); skillInput.value = ''" class="bg-indigo-600 text-white px-4 py-2.5 rounded-xl font-bold text-sm hover:bg-indigo-700">Add</button>
            </div>
            <div class="flex flex-wrap gap-2">
              <span *ngFor="let s of skills(); let i = index" class="flex items-center gap-1 px-3 py-1.5 bg-indigo-100 text-indigo-700 rounded-xl text-sm font-semibold">
                {{ s }}<button type="button" (click)="removeSkill(i)"><span class="material-symbols-outlined text-sm ml-1">close</span></button>
              </span>
            </div>
          </div>
          <div class="col-span-2">
            <label class="block text-sm font-semibold text-gray-700 mb-2">Job Description *</label>
            <textarea formControlName="description" rows="6" placeholder="Describe the role, responsibilities, requirements..." class="w-full border border-gray-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-gray-50 resize-none"></textarea>
          </div>
        </div>

        <div *ngIf="error()" class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl text-sm">{{ error() }}</div>

        <div class="flex gap-3 pt-2">
          <a routerLink="/recruiter/listings" class="flex-1 text-center bg-gray-100 text-gray-700 py-3 rounded-xl font-semibold hover:bg-gray-200">Cancel</a>
          <button type="submit" [disabled]="form.invalid || submitting()" class="flex-1 bg-indigo-600 text-white py-3 rounded-xl font-bold hover:bg-indigo-700 disabled:opacity-50">
            {{ submitting() ? 'Posting...' : 'Post Job' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
